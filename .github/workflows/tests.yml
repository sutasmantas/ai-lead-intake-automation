name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify the pinned provider wheel
        run: sha256sum -c deliveryguard-0.2.0.sha256
        working-directory: vendor
      - run: python -m pip install --upgrade pip
      - run: python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
      - run: python -m pip install "build>=1.3,<2" "twine>=6.2,<8"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test_contract_mutants.py
      - run: python scripts/build_release.py
      - run: python -m twine check dist/*
      - run: python -m json.tool workflows/leaddock-intake-booking.json > /dev/null
