name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the pinned provider wheel
        run: sha256sum -c deliveryguard-0.2.0.sha256
        working-directory: vendor
      - run: python -m pip install --upgrade pip
      - run: python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool workflows/leaddock-intake-booking.json > /dev/null
